# Cargo configuration for the x86_64 no_std kernel workspace.
[build]
target = "x86_64-unknown-none"

[target.x86_64-unknown-none]
linker = "rust-lld"
rustflags = [
    "-D", "warnings",
    "-C", "linker-flavor=ld.lld",
    "-C", "relocation-model=static",
    "-C", "code-model=kernel",
    "-C", "force-frame-pointers=yes",
    "-C", "target-feature=-sse,-sse2",
    "-C", "link-arg=-Tkernel/x86_64-minios.ld",
    "-C", "link-arg=--build-id=none",
    "-C", "link-arg=-n",
]
